  # 2026-07-25 发布。产物型 skill（笔记表追加 + 核对报告 HTML+MD 双产物落 literature/），
  # 纯提示词层（无 scripts/，与同构命令一致）。
  # 工具型 + 核对器型：整理用户导入的题录入 literature/笔记表.md（五字段标占位）+ 题录-草稿一致性核对。
  # 三条不变：① 题录不编（只整理实际导入的题录、字段缺失标占位、绝不凭记忆补、不凭空生成）；
  # ② 一致性核对客观陈列（陈列对应关系、不判对错、"无对应题录"不判编造交 verify）；
  # ③ 产物如实披露整理来源（条目标来源、核对报告顶部声明非存在性核验）。
  # 与 verify 分工（关键）：题录即用户从权威库导出的证据（PRD §128）、import 不重复 API 核验；
  # 存在性 API 核验（题录是否真实存在）归 verify。二者衔接：import 入库、verify 核验。
  # 跨学科通用、不设让路（题录格式各学科一致）。
  # 三停点流程：读题录+解析+检测草稿 → 整理入表+一致性核对（停）→ 落盘留痕交棒。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测）;
  # ② 题录格式解析基于启发式、复杂或罕见格式可能失败（标占位请用户确认）;③ 跨宿主验证未做。
  # 详见 tests/paper-import/。

