  # 2026-07-25 发布。发布门：量化门槛达标（tests/paper-verify/test_acceptance.py 42 条样本——
  # 虚构检出率 100%、真实误报率 0%、中文误伤 0）、确定性单测 63 passed（parse/judge/format/report/verify
  # 全覆盖）、真实 API 端到端三路径冒烟通过（真实→VERIFIED、编造前缀→NOT_FOUND、ISTIC 中文→PENDING_MANUAL）。
  # 上游联动：routing.py + models.py 增 doi_ra="not_registered" 态（前缀未注册自证不存在）。
  # 已知观察项（非 blocker，已登记）：① 裸模型 vs 带 skill 端到端并排对比待跑（离线门槛已过，
  # 同 search/topic 惯例标"待跑"）；② claim 过程中立性门（独立跑 N 次不下定论）N≥3 runner 待实跑；
  # ③ 引用解析器启发式，作者/venue 提取不保证准确（DOI/year 为主、第一作者姓比对容错）；
  # ④ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-verify/、evals/paper-verify/README.md。
  # 2026-07-28 增 HTML 报告视图（scripts/report_html.py，默认生成、--no-html 关）：
  # 与 MD/JSON 同源一份 payload，加裁决横幅 / 六态筛选轨 / 字段对照表 / 锚点直达 / 可点 DOI。
  # 两个决策别推翻：① 样式走 Tailwind CDN（同其余报告模板），但 _shared/tailwind.config.js
  # 必须原样内联进产物——产物落用户项目后相对路径指不到 skill 包（路径问题、与有无网络无关）；
  # 内联时须转义 </，否则 config 注释里的 </script> 提前闭合标签、整份 config 静默失效
  # （四层色全回落默认主题、页面照样出，极难自查——实际踩过）。② 文件名 report_html.py
  # 不叫 render_html.py——paper-search 已占该模块名，pytest 同进程会被 sys.modules 顶替。

- name: paper-format
  phase: D
  stage_zh: 评审与修订
  intent_zh: GB/T 7714-2015 著录格式检查（纯规则，内建于 paper-verify）
  dir: review/
  builtin_in: paper-verify
  status: released
  guidance_zh: 要查参考文献格式是否符合国标时用（随 paper-verify 发布）。
  # 2026-07-25 随 paper-verify 发布（内建子命令，独立入口 scripts/format_check.py）。

- name: paper-claim
  phase: D
  stage_zh: 评审与修订
  intent_zh: 结论夸大检查——核对结论是否超出结果支撑（内建于 paper-verify）
  dir: review/
  builtin_in: paper-verify
  status: released
  guidance_zh: 要查论文结论有没有说过头话时用（随 paper-verify 发布）。
  # 2026-07-25 随 paper-verify 发布（内建子命令，纯提示词层、过程中立性门验收）。

- name: paper-review
  phase: D
  stage_zh: 评审与修订
  intent_zh: 模拟评审——多视角模拟审稿意见（期刊审稿/学位论文盲审/答辩委员）+ 分项评分；强制询问稿件来源、不接收他人在审稿件
  dir: review/
  status: released
  guidance_zh: 投稿/答辩前想预演评审意见、提前补漏时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 review/），
  # 纯提示词层（无 scripts/，与同构命令一致）。
  # 上游消费 draft 正文（必要）+ verify 产物（可选）；下游供 revise（修订+回复信）。
  # 多视角模拟陈列器：期刊审稿 / 学位论文盲审（§385 预设、限定为模拟盲审挑刺套路） / 答辩委员三视角。
  # 三条不变：① 不接收他人在审稿件（会话开始强制询问稿件来源、用户以评审人身份持有的他人在审稿件
  # 立即拒绝、违反同行评审保密义务 §361；只评审本人或指导学生稿件）；② 不替用户写回复信（归 revise）；
  # ③ 评分是模拟视角陈列、非 AI 对论文的价值判断（分项评分每维标「模拟常见审稿维度」、
  # 禁「行/不行」「值得发表」总判断、顶部声明 + 总分配文「模拟练习产物、不代表真实水平」）。
  # 评分张力（PRD §132 要评分 vs 项目「不下价值结论」底线）经 brainstorming 七问 + 用户拍板方案 A 化解：
  # 分项评分（每维可追溯模拟常见维度）+ 模拟视角声明、既满足 PRD 又守底线。
  # 学科三梯队：评审维度按梯队调整（实证全维度/理论型调整/诠释型调整）、不设让路。
  # 三停点流程：强制询问稿件来源+读输入+学科判定 → 多视角模拟评审（停）→ 落盘留痕交棒。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测）;
  # ② 评分与意见质量依赖模型对学科评审惯例理解、可能需多轮调;③ 期刊特定评审维度（ICLR/Nature）
  # 留 Phase 2+ references 扩展;④ 跨宿主验证未做。详见 tests/paper-review/。

- name: paper-revise
  phase: D
  stage_zh: 评审与修订
  intent_zh: 修订辅助——修订建议对照表 + 逐点回复信初稿（基于已有研究事实起草、采纳由用户逐条决定）
  dir: review/
  status: released
  guidance_zh: 收到审稿意见、要逐条修订并写回复信时用。
  # 2026-07-26 发布。产物型 skill（HTML+MD 双产物落 review/），
  # 纯提示词层（无 scripts/，与 paper-review / abstract 同构）。
  # 上游消费 draft 正文（必要）+ review 产物（可选）+ verify 产物（可选）。
  # 双路输入：真实审稿意见粘贴（作者侧核心场景）+ paper-review 模拟下游（预演修订）。
  # 三条不变：① 不替用户决定是否采纳（每条标 ❓ 待用户决定）；② 不编内容应付审稿人
  # （基于用户已有研究事实、禁编新结果/未读文献/夸大）；③ 不替用户写整段新正文（归 draft）。
  # 学科三梯队：修订方向按梯队调整（实证补实验/统计、理论补推导/命题、诠释补文本证据）、不设让路。
  # 三停点流程：读输入+解析+学科判定 → 对照表+回复信初稿（停）→ 落盘留痕交棒。
  # 留痕级别：成句生成级（回复信措辞是 AI 起草的新句、与 abstract/draft 同级、本项目第三个成句生成级命令）。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测）;
  # ② 回复信措辞依赖模型对学科惯例理解、可能需多轮调;③ 期刊特定回复信模板（Nature/ICLR）
  # 留 Phase 2+ references 扩展;④ 跨宿主验证未做。详见 tests/paper-revise/。

# ── 阶段 E｜发表与发表后（环节 20-23）────────────────────────────────────
- name: paper-disclose
  phase: E
  stage_zh: 发表与发表后
  intent_zh: AI 使用说明生成——一键汇编 .paper/ 四级留痕记录
  dir: submission/
  status: released
  guidance_zh: 要生成投稿用的 AI 使用披露说明时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 submission/）,
  # 纯提示词层（无 scripts/,与 paper-topic / outline 同构）。
  # .paper/ 留痕体系的第一个消费者：按 PRD 四级（构思讨论 / 大纲结构 / 成句生成 /
  # 语言润色）归类陈列,缺级标占位,反向暴露留痕体系覆盖盲点。
  # 三条不变：① 只读不编（.paper/ 空则让路）;② 留痕如实（可隐去但顶部强制声明）;
  # ③ 不下价值结论（禁"AI 占比 X%"）。
  # 段落级读者标签轴（👤导师 / 📋研究生院 / 🔎期刊 / 🛡️AIGC 检测）,HTML 读者切换器。
  # 三停点流程：扫留痕归类 → 摆草案 → 逐条修订 → 落盘留痕。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测,
  # 与 topic / outline 同构）;② 期刊特定模板（ICLR / Nature）第一版不做,留 Phase 2+
  # references/ 扩展;③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-disclose/。

- name: paper-submit
  phase: E
  stage_zh: 发表与发表后
  intent_zh: 投稿准备——投稿材料 checklist 整理 + 目标期刊常见投稿要求陈列 + cover letter 要点骨架（基于已有研究产物、不替用户选刊/写整段 cover letter/编期刊信息）
  dir: submission/
  status: released
  guidance_zh: 论文写完要投稿、要整理投稿材料清单、要查期刊投稿要求、要准备 cover letter 时用。
  # 2026-07-26 发布。产物型 skill（HTML+MD 双产物落 submission/），
  # 纯提示词层（无 scripts/，与 paper-disclose / revise / review 同构）。
  # 阶段 E 收口命令：覆盖生命周期环节 20（投稿、期刊适配、格式转换）；
  # 环节 21 署名/基金声明/AI 披露的 AI 披露部分归 paper-disclose、署名/基金声明归研究者本人；
  # 环节 22 发表后传播（PRD §148 项目不覆盖）、环节 23 发表后监测（PRD §149 项目不覆盖）。
  # 上游消费 draft 正文（必要）+ verify/review/revise 产物（可选）+ disclose AI 使用说明（可选）；
  # 下游供 paper-typeset（格式转换，流程关系非打包关系，仿 figure → plot）——
  # 投稿动作本身由人类在期刊系统真实执行，无命令代劳。
  # 2026-07-27 联动改造（随 paper-typeset 发布）：不变③ 原文「不代做 LaTeX/DOCX 转换」
  # 已精确化——PRD §448 禁的是**期刊特定排版模板库**，不是格式转换本身；通用转换管线
  # （md → Word/LaTeX/PDF + 国标著录）归 paper-typeset。共五处改动：不变③ / 生命周期段下游 /
  # 交棒第 3 项 / 越界表（原一行拆成「某刊模板=越界」与「转格式=正常能力」两行）/ v1 非范围。
  # 清单整理器 + 要求陈列器：陈列目标期刊常见投稿要求类目（按三梯队期刊生态调整）+
  # 整理投稿材料 checklist 草案 + cover letter 要点骨架（研究亮点/与期刊契合/未同时投递声明/推荐审稿人占位）。
  # 三条不变：① 不替用户做投稿决策（选刊/预印本/撤稿/cover letter 定稿/出版伦理判断全归人、每项标 ❓）；
  # ② 期刊信息不编造（只陈列通用类目、禁编影响因子/接收率/审稿周期/模板/截图、以官网为准）；
  # ③ 不替用户写 cover letter 整段（归 draft）、不做查重降重（PRD §446 指路知网）、
  # 不做期刊格式模板库（PRD §448 指路官方模板）。
  # 学科三梯队按期刊生态：实证理工（SCI/英语）/ 实证社科（CSSCI）/ 人文社科（中文核心、集刊）、不设让路。
  # 三停点流程：读输入+学科判定+期刊生态 → checklist+要求陈列+cover letter 骨架（停）→ 落盘留痕交棒。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测,
  # 与 disclose/revise/review/abstract 同构）；② 期刊特定投稿要求库（Nature/ICLR/中文核心 D 类）
  # 留 Phase 2+ references 扩展；③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-submit/。

- name: paper-typeset
  phase: E
  stage_zh: 发表与发表后
  intent_zh: 出版链——Markdown → LaTeX/DOCX/PDF 转换管线 + GB/T 7714-2015 国标著录（内置官方 CSL 两制式）；只换容器不改一个字，环境缺失给「原因+安装指引+手工命令」四件套、绝不伪造产物
  dir: submission/
  status: released
  guidance_zh: 论文写完、期刊要 Word/LaTeX/PDF 版稿件，或参考文献要按国标渲染时用；由 /paper-submit 引导进入或独立调用。
  # 2026-07-27 发布。产物型 + 脚本型 skill，**产物是转换后的文件本身**（落 submission/）
  # + submission/转换记录.md——**无 HTML 报告产物**（与其余 16 个 skill 不同，spec §4.2 已定：
  # 为一个只产 .docx/.pdf 的命令再做 HTML 报告是纯仪式）。
  # 含确定性内核 scripts/export.py（本仓库有 scripts/ 的 skill：verify / search / doctor /
  # screen / style / typeset）+ 共享探测层 _shared/paper_shared/toolchain.py。
  # **有独立目录、不填 builtin_in**：要放 scripts/export.py 与 references/csl/，填了会让
  # tests/test_manifest_consistency.py::test_内建子命令不应有独立目录 失败（spec §2 点了这个易错点）。
  # 建模与 paper-plot 一致：独立目录 + 由 paper-submit 主流程引导进入（流程关系、非打包关系）。
  # 与 screen / style 同出一份 spec（系统综述 · 风格校准 · 出版链三块补齐），为**第三（末）交付单元**。
  # 三条不变：① 不改一个字（只换容器、绝不「顺手润色」；转换后按校验边界逐格式校验）；
  # ② 环境缺失明确降级不静默（四件套：未生成什么/原因/安装指引/可手工执行的完整命令；
  # 绝不假装成功、绝不用模型生成一个「看起来像」的产物——继承 CLAUDE.md 唯一保留的代码层约束）；
  # ③ 不做期刊/学校排版模板库（PRD §448，指路官网）。
  # **校验边界（本命令最需要诚实的一处）**：.tex 无 bib → 源正文汉字序列与产物逐字相等（强）；
  # .tex 有 bib → 源汉字序列是产物连续子串（参考文献由 CSL 追加、必然多字）；
  # .docx/.pdf → **无法字符级校验**，只校验源文件 md5 未变 + 产物非空，**绝不谎称校验过**
  # （对二进制谎称校验比不校验更坏：用户会以为有保障）。校验前剥 HTML 注释（pandoc 默认丢弃）。
  # 五态退出码（五个处置动作互不相同，故不合并）：0 全部成功 / 1 pandoc·xelatex 返回非零
  # （转述 stderr、不重试不改源文件）/ 2 环境缺失降级（已生成部分照常交付、未生成逐项列明，
  # 不得说成「转换失败」）/ 3 输入·输出目录·CSL·bib 路径问题 / 4 **正文一致性校验失败**
  # （最严重：产物不可信、勿投稿）。
  # 三个最易静默错的参数（references §4）：--citeproc 必须显式给（pandoc ≥2.11 起 --csl/
  # --bibliography 不再自动启用 citeproc，漏了引用会原样输出成 [@key] 而产物「看起来成功」）；
  # 中文 PDF 必须 --pdf-engine=xelatex + CJKmainfont=<族名>（传文件名无效）；.tex 必须 --standalone。
  # 内置 CSL 两制式（与 paper-format 支持的两种对齐）：gbt7714-2015-numeric.csl（顺序编码制）+
  # gbt7714-2015-author-date.csl（著者-出版年制），取自 CSL 官方仓库、CC BY-SA 3.0、
  # 许可与出处见 references/csl/LICENSE。**CSL 绝不可由模型凭记忆生成**——数百行 XML，
  # 手写必与国标有出入，且错误会经「format 查、typeset 产」的闭环放大成「看起来合规」。
  # 与 paper-format 的闭环：format 查国标著录是否合规、typeset 用国标 CSL 产合规著录，一查一产。
  # paper-doctor 联动：新增 typeset 分组三项（pandoc/xelatex/中文字体），**独立分组、不进
  # compute_overall、status 用 warn 而非 fail**（照 cache 的先例：缺了只影响转格式，
  # verify/search 照常，判成 blocked 是误报）。
  # 跨学科通用、不设让路（转格式各学科一样）。
  # 已知观察项（非 blocker）：① **端到端真实转换未验证**——本机既无 pandoc 也无 xelatex，
  # 单测全程 mock subprocess（spec §9 已定）、成功路径靠 --dry-run 打印命令人工核对；
  # **降级路径已真跑过**（退出码 2、四件套文案、输出目录保持为空无半成品）。装上 pandoc +
  # MacTeX 后应补一次真实端到端验证，届时可消掉本条；② 只支持 docx/tex/pdf 三格式，
  # 其他（epub/odt）报退出码 3，pandoc 本身支持但本命令不校验；③ 中文字体探测覆盖三平台常见
  # 字体 + fc-list，罕见字体环境会落降级路径；④ 图片相对路径以工作目录解析，需在项目根跑；
  # ⑤ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-typeset/。
