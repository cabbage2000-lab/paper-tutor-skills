  # 2026-07-26 发布。产物型 skill（HTML+MD 双产物落 manuscript/），
  # 纯提示词层（无 scripts/，与 paper-outline / draft / logic / abstract / method / disclose 同构）。
  # 覆盖阶段 C 环节 14「图表可视化」（标尺 5 阶段 23 环节中阶段 C 最后一环）。
  # 三条不变：① 不替用户做研究表达决策（图类/图注/配色/工具陈列常见选项 + ❓ 待决定、摆事实不推荐）；
  # ② 不编数据不编图表内容（f：贴数据用真实 + 顶部声明、没贴或仅口述用 PAPER_PLACEHOLDER + 顶部声明、
  # 绝不编看似真实的研究数据——CLAUDE.md 处 2 死线）；③ 诊断与建议可追溯（视觉可靠性低标 ⚠️ 建议自查、
  # 配色标 hex + 色板来源）。
  # 双模式自适应：B 诊断（贴图/代码静态分析/口述降级三路径）+ C 设计建议（a 图类/b 图注骨架/c 配色/d 坐标轴/e 工具）。
  # 学科三梯队不让路：第一梯队实证理工社科（柱/折/箱/散/误差/直方/热图 + 子领域 KM/森林/ROC）、
  # 第二梯队理论型规范文本型（函数曲线/推导图/交换图 + 子领域相图/概念关系图/算法流程图）、
  # 第三梯队人文（时间线/地图/谱系图/年表）。
  # 留痕混合级：B 诊断 + C a/d/e 构思讨论；C b 大纲结构；C c 构思讨论（取自公开色板）；
