- name: paper-verify
  phase: D
  stage_zh: 评审与修订
  intent_zh: 引用存在性核验（六态：已核实 / 元数据不符 / 已撤稿 / 未找到（疑似不存在）/ 无法核实 / 待人工核对）
  dir: review/
  status: released
