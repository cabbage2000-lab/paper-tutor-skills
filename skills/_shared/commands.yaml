# Paper 命令主清单（单一事实来源）
#
# 本文件是 Paper 全部命令的权威注册表。`paper-help` 的命令总表与推荐、
# `paper-init` 的「命令发布映射表」均从此推导——新增或发布命令时只改本文件，
# 两个消费方自动同步，避免两处维护脱节。
#
# 字段说明：
#   name          命令名（去斜杠，= skill 目录名 = 触发名）
#   phase         生命周期阶段标签：A-E 研究阶段 / infra 跨阶段基础设施
#   stage_zh      中文阶段名（用于按阶段分组呈现）
#   intent_zh     一句话定位（用户可见）
#   dir           落盘目录（研究命令才填；基础设施命令留空）
#   builtin_in    仅内建子命令填：宿主命令名。语义 = 本命令没有独立 skill 目录，
#                 入口寄生在宿主 skill 的 SKILL.md 里（先例：paper-format /
#                 paper-claim 内建于 paper-verify）。
#                 不填 = 独立 skill，必须有同名目录 + SKILL.md。
#                 注意与「流程上可由某命令进入」区分：paper-plot 有独立目录、
#                 可独立调用，只是 paper-figure 的主流程会引导进入它——那是
#                 流程关系，不是打包关系，故 plot 不填 builtin_in。
#                 校验：tests/test_manifest_consistency.py
#   status        发布状态：released（已发布）
#                           planned（规划中，开发中）
#                           phase2 / phase4（明确归属更晚阶段）
#   guidance_zh   「什么时候用」指引（paper-help 推荐时附带的出口说明）
#
# 发布联动：某命令可用时把它的 status 翻转为 released——paper-init 生成的
# README 写入者列、paper-help 的命令总表都据此呈现。
#
# 命名约定（PRD·子命令集·约定①）：paper- 前缀 + 单个学术熟词；
# 基础设施命令取工程熟词（init / pipeline / help）。

# ── 跨阶段基础设施（不对应 5 阶段 23 环节中的任何研究环节）─────────────────
- name: paper-init
  phase: infra
  stage_zh: 跨阶段基础设施
  intent_zh: 科研工作目录脚手架——一轮提问建标准目录骨架，顺带生成项目信息配置（长期记忆）与可选的宿主配置文件
  dir: ""
  status: released
  guidance_zh: 要开始一个新研究项目、新论文，或想把科研目录结构规范化时用。

- name: paper-help
  phase: infra
  stage_zh: 跨阶段基础设施
  intent_zh: 命令导航器——帮你找到当下该用哪个 paper 命令
  dir: ""
  status: released
  guidance_zh: 不确定 Paper 能做什么、该用哪个命令时用。

- name: paper-doctor
  phase: infra
  stage_zh: 跨阶段基础设施
  intent_zh: 环境就绪度体检——一条命令查清核验/检索环境能不能用、缺什么、怎么补
  dir: ""
  status: released
  guidance_zh: 跑 verify/search 前想先确认数据源、网络、凭证是否就绪，或核验命令跑不起来要排查环境时用。

- name: paper-daily
  phase: infra
  stage_zh: 跨阶段基础设施
  intent_zh: 每日学术雷达——抢发检测（全源对照已发文献）+ 新发泛读（arXiv 自动轨 + 用户多源补充）。LLM 给高/中/低相关度标签但不打分、不排序、不替用户判研究价值；断网显式声明降级
  dir: daily/
  status: released
  guidance_zh: 手头有研究想法（RQ / 方法 / 想投会议），想确认是否被人抢发、或每天泛读该方向新发论文时用。
  # 2026-07-26 发布。产物型 skill（HTML+MD+JSON 三产物落 daily/），
  # 纯提示词层（无 scripts/，复用 paper-search/scripts/search.py 做检索）。
  # 借鉴 PaperFlow 的 daily 概念、但守本仓库"三条不变"：
  # ① 不替用户判研究价值、不排序（高/中/低是辅助陈列标签、非价值判断）；
  # ② 抢发命中不夸大、不替用户下定论（每条标概念比对依据、末尾疑问句式交回用户）；
  # ③ 真实 API 为准、断网显式声明降级（不静默用模型记忆顶替、继承 paper-verify 代码层约束）。
  # 三条红线与 paper-search 同源（日报场景化重写）：不判研究价值 / 覆盖方式必声明 + 中文缺口必提示 /
  # 真实 API 为准。
  # 双轨设计：抢发对照轨（全源 search.py，不限时间）+ 新发自动轨（仅 arXiv，时间窗今日/最近 N 天）+
  # 用户补充轨（用户粘的多源新发：RSS/订阅/Twitter/PaperFlow 输出/同事推送）。
  # 两停点流程：锁定 RQ+时间窗+补充轨 → 双轨拉取+抢发对照 → 三段式陈列（停）→ 落盘留痕。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测，
  # 与 topic/outline/logic/disclose/abstract/review 同构）；② 复用 paper-search/scripts/search.py，
  # 若 search.py 接口变更需同步；③ 时间窗过滤依赖 arXiv API 能力，按天精确过滤不可用时按年拉再筛；
  # ④ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-daily/。

# paper-pipeline 已取消（2026-07-26）：编排器想解决的「上下文超」正解是拆会话，
# 而拆会话靠 .paper/ 目录留痕 + paper-help 导航已足够；状态机/检查点功能被
# paper-init 建的目录结构与各 skill 的 .paper/ 留痕天然覆盖，编排器无不可替代的
# 增量价值。详见 memory: paper-pipeline-wontdo。

# ── 阶段 A｜选题与立项（环节 1-7）──────────────────────────────────────
- name: paper-topic
  phase: A
  stage_zh: 选题与立项
  intent_zh: 选题导航器——一步步引导、逐层给该方向客观常见的选项（不推荐不排序），用户拍板聚焦成可研究的研究问题（RQ），产 HTML 报告不下结论
  dir: topic/
  status: released
  guidance_zh: 刚有个模糊方向、还说不清要研究什么时用。
  # 2026-07-25 发布（v3 选题导航器）。发布门：过程中立性门达标（5 独立 runner + rev-gate 五条
  # 判据零命中）、行为验收 8 场景通过、裸模型对比增量清晰（裸模型替判断 6/3/6/3 vs 带 skill 全 0）、
  # pytest 159 passed、最终 whole-branch review Ready to merge。
  # 已知观察项（非 blocker，已登记）：① SKILL.md 3 处贴边价值表述（"很值得做/很正/挺好"，贴红线 2
  # 边、未命中五条判据，留观察）；② 过程中立性门 runner=opus，弱模型未验；③ A-弃/脚本 C 各单跑一次
  # （A-选 跑满 3 次）；④ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-topic/。
  # 2026-07-25 后续增强（呈现层增量，不触发重跑）：报告产物从五块升六块（新增「下一步验证清单」、
  # 只许疑问句）、引入四层内容标注（👤/📋/🪞/❓，无"AI 新判断"层）、HTML 样式系统拆到
  # references/报告样式模板.html（学术档案风、四层语义色、离线单文件）。核心机制与发布门判据未变。

- name: paper-search
  phase: A
  stage_zh: 选题与立项
  intent_zh: 中英双轨文献检索与综述辅助
  dir: literature/
  status: released
  guidance_zh: 有了 RQ 要查文献、做文献综述、找研究缺口时用。
  # 2026-07-25 发布。行为验收：场景 1/2/3/4/6/8/9/10 通过、确定性单测 159 passed。
  # 已知差异：场景 5「不排序」在 Claude Code/Opus 侧有执行偏离（2 次稳定替排序、违反
  # 红线 1），Codex 侧正确遵守——非 skill 设计缺陷，待加强 Claude 侧话术力度。
  # 场景 7 断网声明级因测试方法局限未可靠验证。详见 tests/paper-search/。

- name: paper-screen
  phase: A
  stage_zh: 选题与立项
  intent_zh: 系统综述筛选——PRISMA 2020 两轮筛选台账（纳入排除由用户逐篇拍板）+ 计数守恒校验 + 流程图 + 数据提取表骨架 + 偏倚工具条目陈列
  dir: literature/
  status: released
  guidance_zh: 要做系统性文献综述、需要 PRISMA 筛选流程图与纳排记录时用。
  # 2026-07-27 发布。产物型 + 脚本型 skill（HTML+MD 双产物 + 台账 + 提取表落 literature/），
  # 含确定性内核 scripts/screen.py（仿 paper-verify 的脚本层分工；
  # 本仓库有 scripts/ 的 skill：verify / search / doctor / screen）。
  # 上游消费 search 产物（literature/文献笔记表.md + 检索日志.md）；下游供 outline
  # （骨架库已有「系统性综述（PRISMA）」专节）。
  # 三条不变：① 不替用户判纳排（逐篇陈列与纳排标准的对应事实 + ❓、产物禁「建议纳入/排除」）；
  # ② 计数守恒不靠模型（screen.py 校验三条守恒等式 + 组合矛盾检查——后者补前者盲区：
  # 标摘筛已排除却填了全文筛的行会被静默丢出流程图而等式照样成立；任一不过即报错不出图、
  # 退出码 1。待定行属筛选未完成、退出码 2，与台账有错区分；读不到台账退出码 3）；
  # ③ 不编文献不编排除理由（台账每行必指笔记表真实条目、理由必是用户原话或用户选的码）。
  # 学科三梯队：第一梯队全走；第二梯队理论型偏倚评估让路；第三梯队人文整体让路（保留检索日志与去重台账）。
  # 明确不做：元分析统计合成（效应量/异质性 I²，与「AI 不接阶段 B 数据分析」边界相撞、
  # 森林图绘制留 paper-plot v1.1+）、PRISMA 27 项自动判定（仅清单陈列 + 用户自评）、
  # 偏倚评分（仅条目清单、评分用户填）。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑模拟脚本（确定性内核有 35 条 pytest）；
  # ② 去重靠 DOI 与标题规范化比对，同一研究的会议版/期刊版机器判不出、需用户手工标 E7；
  # ③ 流程图识别框如实标「记录总数」、未拆「数据库检索 / 其他来源」两栏（拆栏留后续；
  # references 的归位规则定位为供报告正文做文字细分）；④ logical_conflicts 里对「待定」的分支在 CLI 路径上不可达
  # （pending_seqs 先返回 2），作为库函数直接调用时仍有效；⑤ 跨宿主验证未做。详见 tests/paper-screen/。

- name: paper-method
  phase: A
  stage_zh: 选题与立项
  intent_zh: 研究设计参谋——双模式自适应（方法-RQ 匹配检查 + 方法类引导）+ 涉人类被试强制伦理审查提示清单
  dir: topic/
  status: released
  guidance_zh: 要定研究方法、检查方法能否回答你的 RQ、或研究涉人类被试要理伦理审查提示清单时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 topic/），
  # 纯提示词层（无 scripts/，与 paper-topic / outline / logic / disclose 同构）。
  # 上游消费 topic 产物（RQ）+ literature/ 笔记表；下游供 proposal / outline。
  # 双模式自适应：检查模式（用户有方法草案→跑匹配维度）/ 引导模式（无草案→摆方法类常见项）。
  # 三条不变：① 不替用户定方法（摆常见不推荐不排序）；② 不下价值结论（陈列+疑问句）；
  # ③ 不出具伦理豁免判断（涉人类被试强制陈列六项提示清单，末尾标「须机构确认，AI 不能替代」）。
  # 学科三梯队：实证全核 / 理论型按类型调整不强套实证模板 / 诠释型轻量让路（让路不让伦理义务）。
  # 两停点流程：读输入+学科+模式判定 → 匹配检查/方法类引导+伦理清单（停）→ 落盘留痕交棒。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测,
  # 与 topic/outline/logic/disclose 同构）；② 涉人类被试检测基于关键词+学科+RQ 形态启发式、
  # 可能漏判（清单顶部固定自检声明交回用户）；③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-method/。

- name: paper-proposal
  phase: A
  stage_zh: 选题与立项
  intent_zh: 开题报告组装——多源汇聚（topic RQ + literature 笔记 + method 研究设计）按中文学位论文制度节点组装草案
  dir: topic/
  status: released
  guidance_zh: 选题、文献、方法都有了、要写学位论文开题报告时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 topic/），
  # 纯提示词层（无 scripts/，与 paper-topic / outline / method / logic / disclose 同构）。
  # 选题与立项阶段收口命令：汇聚 topic（RQ）+ search（literature 笔记）+ method（研究设计参谋），
  # 按中文学位论文开题报告常见制度节点（选题依据/文献综述/研究内容/研究方法/技术路线/
  # 工作计划/参考文献/创新点）摆骨架 + 从上游真实产物提取片段。
  # 三条不变：① 不替用户定研究内容（摆制度节点骨架、研究内容/工作计划/创新点标占位请用户填、
  # 不代写各节正文）；② 锚点不造假（文献必指 literature 真实笔记、RQ 必指 topic 原话、
  # 方法必指 method 产物）；③ 产物如实披露组装来源。
  # 学科三梯队：研究方法部分按梯队调整（实证/理论/诠释）、不设让路（开题各学科都要写）。
  # 三停点流程：读多源输入+学科判定 → 摆骨架+提取片段+引导补充（停）→ 落盘留痕交棒。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测,
  # 与 topic/outline/method/logic/disclose 同构）；② 第一版只产通用制度节点母版、
  # 各校特定模板留 Phase 2+ references 扩展;③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-proposal/。

# ── 阶段 B｜执行研究（环节 8-11）────────────────────────────────────────
# Paper 明确不设命令覆盖阶段 B——数据采集、实验、分析由研究者本人负责，
# AI 不进场。这是「核心分工原则」（AI 负责效率，人负责研究决策）的体现，不是缺口。

# ── 阶段 C｜成文（环节 12-16）────────────────────────────────────────────
- name: paper-outline
  phase: C
  stage_zh: 成文
  intent_zh: 论文大纲——基于 RQ 与文献笔记产出大纲草案
  dir: manuscript/
  status: released
  guidance_zh: 文献读得差不多、要搭论文骨架时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 manuscript/），
  # 纯提示词层（无 scripts/，与 paper-topic 同构）。
  # 三条不变：① 结构取舍由用户拍板；② 锚点不造假（必指 literature/.paper/ 真实笔记、
  # 无支撑标占位）；③ 产物只记用户拍板的结构。
  # 四停点流程：选骨架 → 起草草案 → 逐章修订 → 落盘留痕。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测，
  # 与 topic 同构）；② 骨架库第一版仅覆盖 IMRD / 学位论文 / 综述 / 案例研究四种，
  # 法学 / 人文留观察；③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-outline/。

- name: paper-draft
  phase: C
  stage_zh: 成文
  intent_zh: 分段正文共写——基于大纲与文献笔记逐段起草正文初稿
  dir: manuscript/
  status: released
  guidance_zh: 有大纲、要逐段展开正文时用。
  # 2026-07-25 发布。产物型 skill（HTML+MD 双产物落 manuscript/）,
  # 纯提示词层（无 scripts/,与 paper-outline / paper-topic 同构）。
  # 三条不变：① 段落取舍由用户拍板（逐段停点）;② 锚点与事实不造假（必指 literature/.paper/ 真实笔记、
  # 数据不在笔记绝不编、无支撑标占位）;③ 产物如实披露成句辅助（PRD 披露第三级、逐段可追溯）。
  # 风格样本机制：用户贴 1-2 段自己写过的文字、AI 只学风格不抄内容（防变相抄袭）。
  # 四停点流程：选段+风格 → 起草第一段 → 段落循环 → 落盘留痕。
  # 上游消费 paper-outline 大纲 + paper-search 文献笔记。下游供 paper-logic / paper-abstract。
  # 2026-07-27 联动改造（随 paper-style 发布）：风格样本机制三档升四档，新增最优
  # A+ 档「读 manuscript/风格基线.md」（paper-style 模式 b 产）——命中则不必再请用户
  # 贴样本，把常态降级档变成常态正常档。共六处改动（机制段 / 降级矩阵 / 会话开始第 3 件事 /
  # 留痕风格来源取值 / 异常表两行 / 交棒），无自动守卫、人工核。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑过模拟脚本、无 pytest（提示词型 skill、无确定性逻辑可测,
  # 与 outline / topic 同构）;② 风格样本只提取句长/虚词/术语密度/引用习惯四特征,
  # 更细粒度风格建模留观察（A+ 档改由 style_metrics.py 机械算出六组特征、比口头描述细）;
  # ③ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-draft/。

- name: paper-style
  phase: C
  stage_zh: 成文
  intent_zh: 风格校准——全文一致性校准（章节特征表 + 章节间偏移按变异系数排序）+ 个人风格基线（持久化供 paper-draft 复用）+ AIGC 误判申诉特征陈列；六组特征一律脚本机械算，禁「读起来像不像 AI」判断
  dir: manuscript/
  status: released
  guidance_zh: 要查各章文风是否一致、要把自己的写作风格存成基线供起草复用、或论文被 AIGC 检测误判要申诉材料时用。
  # 2026-07-27 发布。产物型 + 脚本型 skill（HTML+MD 双产物落 manuscript/，
  # 模式 b 另落 manuscript/风格基线.md），含确定性内核 scripts/style_metrics.py
  # （本仓库有 scripts/ 的 skill：verify / search / doctor / screen / style）。
  # 与 screen / typeset 同出一份 spec（系统综述 · 风格校准 · 出版链三块补齐），为第二交付单元。
  # 上游消费 manuscript/ 正文（draft 产物或用户自写）；下游供 paper-draft（读风格基线对齐起草，
  # 把 draft 的常态降级档变成常态正常档——这是本命令除「查一致性」外的真实增量）与
  # paper-disclose（模式 c 指向 .paper/ 留痕作过程证据）。
  # 三条不变：① 不替用户改写定稿（默认只陈列偏移与着力点、每条以疑问句收尾、产物禁
  # 「建议改成 / 应当改为」；用户明确要示例改法才给 1-2 句并标「示例、非定稿」）；
  # ② 风格特征是算出来的不是感觉出来的（六组特征一律 style_metrics.py 机械算，
  # 禁「读起来像 / 不像 AI」「文风不够学术」；脚本跑不了显式声明「特征不可用」、不凭感觉顶替）；
  # ③ 硬拒「去 AI 味躲检测」（服务全文一致性与误判申诉、不服务规避检测，指路 paper-disclose）。
  # 三模式：a 全文一致性校准 / b 建立个人风格基线（必问「这几段是你自己写的还是 AI 起草过的」——
  # 从 AI 草稿算基线会让 draft 对齐 AI 自己的风格、形成回音室）/ c 误判申诉特征陈列。
  # 内核六组特征：句长分布（引号感知切句——引号内句号不切、`……` 算一个边界、小数点与
  # et al. 不切）/ 虚词密度（长词优先匹配防重复计数）/ 引用位置三形态 / 人称频次 /
  # 四字格密度（近似）/ 术语密度（近似，不引 jieba）；章节间偏移按变异系数 CV 排序
  # （量纲不同时极差不可比）；脚本只排序、不下结论。
  # 退出码三态：0 算出结果 / 2 样本不足（剥离表格代码引用块后切不出句子，不是错误）/
  # 3 读不到输入。不凑第四码——本命令无守恒等式可校验，不存在「算得出但不可信」的中间态。
  # 留痕混合级（仿 paper-figure）：默认构思讨论；用户明确要示例改法、AI 给出改写句时该次
  # 升「构思讨论 + 语言润色」——没给改法不许写语言润色级（虚报辅助级别同属不如实留痕）。
  # 学科三梯队只改解读口径、不改脚本算什么，且**不设整体让路**（风格一致性各学科都要看，
  # 只是判据宽严不同：人文放宽到「同一文内不跳档」）——与 screen 的人文整体让路不同，勿类推。
  # 明确不做：替用户改写定稿、「降 AI 味」改写服务、查重降重（PRD §446 指路知网）、
  # 判定文本是否由 AI 生成、解释检测器阈值。
  # 已知观察项（非 blocker）：① 行为验收靠人工跑模拟脚本（确定性内核有 51 条 pytest）；
  # ② 术语密度与四字格为近似值（零第三方依赖不引 jieba），产物每处必标「近似」，
  # 给术语表可让术语密度变精确；③ 引用位置只认三种行内形态，全脚注制（`[^1]`）会全为 0、
  # 须如实声明该项不可用；④ 章节切分按「能切出 ≥2 节的最浅 ATX 标题层级」，非常规标题结构
  # 可能切得不理想（可改用 --dir 多文件）；⑤ 风格基线契约无自动守卫（markdown 非代码），
  # 字段名改动会静默破坏 draft 的读取，改前须看 references/风格基线契约.md；
  # ⑥ 跨宿主验证未做（第二宿主待跑）。详见 tests/paper-style/。

